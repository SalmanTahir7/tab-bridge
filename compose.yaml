name: tab-bridge
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: tabbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_password, db_admin_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [database]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    command: [postgres, -c, max_connections=30, -c, shared_buffers=64MB, -c, max_wal_size=256MB, -c, log_statement=none, -c, log_min_error_statement=panic]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d tabbridge]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: {driver: json-file, options: {max-size: 5m, max-file: "3"}}
  app:
    build: .
    environment:
      NODE_ENV: production
      LOCAL_DEMO: "false"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Set TURNSTILE_SITE_KEY in .env}
      TURNSTILE_SECRET_FILE: /run/secrets/turnstile_secret
      QUOTA_SECRET_FILE: /run/secrets/quota_secret
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      DATABASE_URL: postgres://tabbridge@db:5432/tabbridge
      BEHIND_TUNNEL: "true"
      SERVE_STATIC: "true"
    secrets: [db_password, turnstile_secret, quota_secret]
    depends_on:
      db: {condition: service_healthy}
    networks: [database, ingress]
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: 5m, max-file: "3"}}
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    networks: [ingress]
    depends_on:
      app: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: {driver: json-file, options: {max-size: 5m, max-file: "3"}}
networks:
  database: {internal: true}
  ingress: {}
volumes:
  pgdata:
secrets:
  db_admin_password: {file: ./secrets/db_admin_password}
  db_password: {file: ./secrets/db_password}
  turnstile_secret: {file: ./secrets/turnstile_secret}
  quota_secret: {file: ./secrets/quota_secret}
  tunnel_token: {file: ./secrets/tunnel_token}
