name: Verify Tab Bridge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: tabbridge
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: tabbridge_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tabbridge -d tabbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tabbridge:test-only-password@localhost:5432/tabbridge_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: docker build -t tab-bridge:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-local-demo
          path: extension-dist/
  # Production deployment is intentionally absent. See docs/DEPLOYMENT.md for
  # the approved-release pull model and future protected-environment workflow.
